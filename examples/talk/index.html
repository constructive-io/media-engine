<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The lighthouse log</title>
<link rel="stylesheet" href="stage.css">
<script src="stage.js" defer></script>
<style>
  :root { --stage-bg: #10202b; --stage-accent: #f2b84b; }
  h1 small { display: block; font-size: 0.4em; font-weight: 500; color: var(--stage-dim); }
  ol { margin: 0; padding-left: 1.2em; }
</style>
</head>
<!-- A deck: one slide at a time. `stage.css` and `stage.js` come from the engine when it serves this folder. -->
<body data-stage="deck">

<section data-slide="title">
  <h1>The lighthouse log <small>read aloud</small></h1>
</section>

<section data-slide="log">
  <h2>Every night, three things</h2>
  <ol>
    <li data-step="1">When the lamp was lit</li>
    <li data-step="2">Which boats came in</li>
    <li data-step="3">What the weather did</li>
  </ol>
</section>

<section data-slide="close">
  <h1>Good night.</h1>
</section>

</body>
</html>
